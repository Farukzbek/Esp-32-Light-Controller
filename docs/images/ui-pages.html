<!doctype html>
<html lang="tr" id="root"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nowlight Ekranları</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Montserrat:wght@500;600&display=swap">
<style>
  /* Düzen: cihaz önizlemeleri bölüm bölüm, her bölüm kendi içinde kayar (dar ekranda sayfa yana taşmaz). */
  :root{--bg:#f1f2f5;--fg:#16171b;--muted:#5f626b;--line:#d8dae0;--chip:#e4e6ec}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121317;--fg:#e8e8ea;--muted:#9a9ca6;--line:#2a2c33;--chip:#23252c;color-scheme:dark}}
  :root[data-theme="dark"]{--bg:#121317;--fg:#e8e8ea;--muted:#9a9ca6;--line:#2a2c33;--chip:#23252c;color-scheme:dark}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.55;
    padding-block:32px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  main{max-width:1180px;margin:0 auto}
  h1{font-size:26px;line-height:1.2;margin:0 0 8px;text-wrap:balance}
  p.sub{margin:0;color:var(--muted);max-width:66ch}
  code{background:var(--chip);padding:1px 6px;border-radius:5px;font-size:13px}
  h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:40px 0 14px;font-weight:600;padding-top:14px;border-top:1px solid var(--line)}
  .row{display:flex;gap:26px;align-items:flex-start;overflow-x:auto;padding-bottom:10px;flex-wrap:wrap}
  figure{margin:0;flex:none}
  figcaption{margin-top:10px;font-size:13px;color:var(--muted);text-align:center;max-width:300px;margin-inline:auto}
  /* Cihaz ekranı hep siyah: AMOLED panelin kendisi. */
  .dev{background:#0b0b0d;padding:9px;border-radius:34px;box-shadow:0 0 0 2px #2c2c31}
  .scr{position:relative;background:#000;overflow:hidden;border-radius:26px;font-family:"Montserrat","Helvetica Neue",Arial,sans-serif;color:#fff}
  .p{width:280px;height:456px}.l{width:456px;height:280px}
  .abs{position:absolute}
  .t28{font-size:28px;line-height:33px;text-align:center;font-weight:500}
  .t20{font-size:20px;line-height:24px}.t14{font-size:14px;line-height:17px}
  .btn{border-radius:50%;width:150px;height:150px;display:flex;align-items:center;justify-content:center}
  .bar{left:0;right:0;bottom:0;height:14px}
  .dot{width:10px;height:10px;border-radius:50%;background:#555}.dot.on{background:#fff}
  .arrow{display:flex;align-items:center;justify-content:center;border-radius:12px}
  svg{display:block}
  .panel{background:#1c1c1e;border-radius:24px;width:100%;height:152px;left:0;top:-22px}
  .scrim{inset:0;background:rgba(0,0,0,.5)}
</style>
</head><body>
<main>
<h1 id="h1"></h1>
<p class="sub" id="sub"></p>
<div id="app"></div>
</main>
<script>
// Dil: sayfa adresinin sonuna #en eklenirse Ingilizce (kumanda yazilimindaki -e waveshare-amoled164-en ile ayni etiketler).
const EN=location.hash==='#en';
document.documentElement.lang=EN?'en':'tr';
const T=EN?{
  title:'Remote screens',
  sub:'Drawn at the real size of the Waveshare ESP32-S3-Touch-AMOLED-1.64 screen (280x456) from the colours and layout values in <code>app_ui.cpp</code>. Hold the device upright and the menu scrolls vertically; hold it sideways and it scrolls horizontally. Labels use the English build (<code>-e waveshare-amoled164-en</code>).',
  portrait:'Portrait (menu scrolls top to bottom)',landscape:'Landscape (menu scrolls left to right)',panel:'Pull-down panel and warnings',
  desk:'DESK\nLAMP',bed:'BED\nLAMP',led:'LED\nSTRIP',all:'ALL\nLIGHTS',on:'ON',off:'OFF',n23:'2/3 ON',
  status:'STATUS',menu:'MENU\nORDER',order:['DESK','BED','LED','ALL','STATUS'],stNames:['DESK','BED','POWER','CHANNEL','ORIENT'],
  batt:'~82% 4.01V',free_p:'FREE / PORT',free_l:'FREE / LAND',lockOn:'ORIENT LOCKED',lockOff:'ORIENT FREE',warn:'BED',
  c1:'1 · Desk lamp (on)',c2:'2 · Bed lamp (off)',c3:'3 · LED strip',c4:'4 · All lights',c4b:'4 · All lights (all off)',c5:'5 · Status',c6:'6 · Menu order (settings page, always last)',
  p1:'Swipe down from the top edge: orientation lock (free)',p2:'Orientation locked',p3:'Bed unreachable (yellow warning) + charging icon (top right)'
}:{
  title:'Nowlight ekranları',
  sub:'Waveshare ESP32-S3-Touch-AMOLED-1.64 ekranının (280x456) gerçek ölçüleriyle, kumanda kodundaki (<code>app_ui.cpp</code>) renk ve yerleşim değerlerinden çizilmiş önizleme. Cihaz dik tutulunca menü dikey, yatay tutulunca yatay kayar. Ekranda Türkçe karakter olmadığı için etiketler ASCII.',
  portrait:'Dikey (menü yukarıdan aşağı kayar)',landscape:'Yatay (menü soldan sağa kayar)',panel:'Üst menü ve uyarılar',
  desk:'MASA\nLAMBASI',bed:'YATAK\nLAMBASI',led:'LED\nSERIT',all:'TUM\nISIKLAR',on:'ACIK',off:'KAPALI',n23:'2/3 ACIK',
  status:'DURUM',menu:'MENU\nSIRASI',order:['MASA','YATAK','LED','HEPSI','DURUM'],stNames:['HUB','YATAK','GUC','KANAL','YON'],
  batt:'PIL ~82% 4.01V',free_p:'SERBEST / DIKEY',free_l:'SERBEST / YATAY',lockOn:'YON KILITLI',lockOff:'YON SERBEST',warn:'YATAK',
  c1:'1 · Masa lambası (açık)',c2:'2 · Yatak lambası (kapalı)',c3:'3 · LED şerit',c4:'4 · Tüm ışıklar',c4b:'4 · Tüm ışıklar (hepsi kapalı)',c5:'5 · Durum',c6:'6 · Menü sırası (ayar sayfası, hep sonda)',
  p1:'Üstten aşağı kaydırınca: yön kilidi (serbest)',p2:'Yön kilitli',p3:'Yatak ulaşılamıyor (sarı uyarı) + şarj simgesi (sağ üst)'
};
document.title=T.title;document.getElementById('h1').textContent=T.title;document.getElementById('sub').innerHTML=T.sub;
const COL={on:'#FFC93C',off:'#2A2A2A',green:'#00C853',red:'#E53935'};
const power=c=>`<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"><path d="M12 3v9"/><path d="M6.4 6.6a8 8 0 1 0 11.2 0"/></svg>`;
const chev=(dir,c)=>{const r={up:'M5 15l7-7 7 7',down:'M5 9l7 7 7-7',left:'M15 5l-7 7 7 7',right:'M9 5l7 7-7 7'}[dir];return `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="${r}"/></svg>`};
const warn=t=>`<div class="abs t14" style="left:14px;top:10px;color:#FFB300;display:flex;gap:5px;align-items:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="#FFB300"><path d="M12 2 1 21h22L12 2zm1 15h-2v-2h2v2zm0-4h-2V9h2v4z"/></svg>${t}</div>`;
const bolt=`<div class="abs" style="right:14px;top:8px"><svg width="22" height="28" viewBox="0 0 22 28" fill="#fff"><path d="M13 0 1 16h8l-2 12 14-18h-8z"/></svg></div>`;
function dots(land,active){let s='';const n=6,total=n*10+(n-1)*14,W=land?456:280,H=land?280:456;
  for(let i=0;i<n;i++){const st=land?`left:${(W-total)/2+i*24}px;top:${H-36}px`:`left:${W-20}px;top:${(H-total)/2+i*24}px`;s+=`<div class="abs dot ${i==active?'on':''}" style="${st}"></div>`}return s}
function device(land,inner,cap){return `<figure><div class="dev"><div class="scr ${land?'l':'p'}">${inner}</div></div><figcaption>${cap}</figcaption></figure>`}

function lamp(land,title,on,label,active,extra){
  const status=on?T.on:T.off,sc=on?COL.green:COL.red,bg=on?COL.on:COL.off;
  const t=title.replace('\n','<br>');
  let h='';
  if(land){
    h+=`<div class="abs t28" style="width:210px;left:${228+105-105}px;top:${140-50-33}px">${t}</div>`;
    h+=`<div class="abs btn" style="left:45px;top:${140-10-75}px;background:${bg}">${power('#000')}</div>`;
    h+=`<div class="abs t28" style="width:210px;left:228px;top:${140+45-17}px;color:${sc}">${label||status}</div>`;
  }else{
    h+=`<div class="abs t28" style="width:250px;left:15px;top:26px">${t}</div>`;
    h+=`<div class="abs btn" style="left:65px;top:${228+20-75}px;background:${bg}">${power('#000')}</div>`;
    h+=`<div class="abs t28" style="width:250px;left:15px;top:${228+125-17}px;color:${sc}">${label||status}</div>`;
  }
  h+=`<div class="abs bar" style="background:${sc}"></div>`+dots(land,active)+(extra||'');
  return h;
}
function status(land){
  const n=T.stNames,rows=[[n[0],'-58 dBm','#00C853'],[n[1],'-71 dBm','#FFB300'],[n[2],T.batt,'#00C853'],[n[3],'1','#fff'],[n[4],land?T.free_l:T.free_p,'#fff']];
  const W=land?456:280,rowH=land?46:62,y0=land?22:100,nameX=land?180:20,valW=land?170:150;
  let h=land?`<div class="abs t28" style="width:160px;left:12px;top:${140-10-17}px">${T.status}</div>`:`<div class="abs t28" style="width:250px;left:15px;top:26px">${T.status}</div>`;
  rows.forEach((r,i)=>{const y=y0+i*rowH;
    h+=`<div class="abs t14" style="left:${nameX}px;top:${y+9}px;color:#8E8E93;width:70px">${r[0]}</div>`;
    h+=`<div class="abs t20" style="left:${W-20-valW}px;top:${y+4}px;width:${valW}px;text-align:right;color:${r[2]}">${r[1]}</div>`});
  return h+dots(land,4);
}
function order(land){
  const names=T.order;const W=land?456:280;
  const rowH=land?46:62,y0=land?16:100,nameX=land?(EN?188:200):20,bw=land?60:56,bh=land?40:50;
  const b1=W-20-2*bw-(land?12:10),b2=b1+bw+(land?12:10);
  let h=land?`<div class="abs t28" style="width:170px;left:12px;top:${140-10-33}px">${T.menu.replace("\n","<br>")}</div>`:`<div class="abs t28" style="width:250px;left:15px;top:26px">${T.menu.replace("\n","<br>")}</div>`;
  names.forEach((n,pos)=>{const y=y0+pos*rowH;
    h+=`<div class="abs t28" style="left:${nameX}px;top:${y+(bh-30)/2}px;font-size:28px">${n}</div>`;
    [0,1].forEach(k=>{const later=k==1,ok=later?pos<4:pos>0;const d=land?(later?'right':'left'):(later?'down':'up');
      h+=`<div class="abs arrow" style="left:${k?b2:b1}px;top:${y}px;width:${bw}px;height:${bh}px;background:${ok?'#3A6EA5':'#222'}">${chev(d,ok?'#fff':'#555')}</div>`})});
  return h+dots(land,5);
}
function panel(locked){
  const bg=locked?'#FFB300':'#3A3A3C',fg=locked?'#000':'#fff';
  return `<div class="abs scrim"></div><div class="abs panel"><div class="abs arrow" style="left:74px;top:${36+22}px;width:132px;height:92px;border-radius:22px;background:${bg};flex-direction:column;gap:8px;color:${fg}">
  <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="${fg}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 3v5h-5"/></svg>
  <span class="t14" style="font-weight:600">${locked?T.lockOn:T.lockOff}</span></div>
  <div class="abs" style="left:117px;bottom:8px;width:46px;height:5px;border-radius:3px;background:#666"></div></div>`;
}
const A=document.getElementById('app');
const sec=(t,h)=>{A.insertAdjacentHTML('beforeend',`<h2>${t}</h2><div class="row">${h}</div>`)};

sec(T.portrait,
  device(0,lamp(0,T.desk,true,'',0),T.c1)+
  device(0,lamp(0,T.bed,false,'',1),T.c2)+
  device(0,lamp(0,T.led,false,'',2),T.c3)+
  device(0,lamp(0,T.all,true,T.n23,3),T.c4)+
  device(0,status(0),T.c5)+
  device(0,order(0),T.c6));

sec(T.landscape,
  device(1,lamp(1,T.desk,true,'',0),T.c1)+
  device(1,lamp(1,T.all,false,'',3),T.c4b)+
  device(1,status(1),T.c5)+
  device(1,order(1),T.c6));

sec(T.panel,
  device(0,lamp(0,T.desk,true,'',0)+panel(false),T.p1)+
  device(0,lamp(0,T.desk,true,'',0)+panel(true),T.p2)+
  device(0,lamp(0,T.bed,false,'',1,warn(T.warn)+bolt),T.p3));
</script></body></html>
