; Nowlight genel isik dugumu: ayni yazilim tum kartlarda; kopruyle eslesince role (isik) olur.
; Web yukleyici (web/flasher) bu ortamlarin ciktisini kullanir: ./build_web.sh
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_deps = homespan/HomeSpan@^2.1.8
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DNOW_NO_CONFIG
    -I../shared

; ESP32-S3 Super Mini (yerlesik USB). Role: GPIO5, BOOT dugmesi: GPIO0
[env:esp32s3-supermini]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DNL_RELAY_PIN=5
    -DNL_BOOT_PIN=0

; Klasik ESP32 DevKit (CP2102/CH340). Role: GPIO5 (bazi kartlarda bu pin acilista calisir: 22 ya da 23 daha guvenli), BOOT: GPIO0
[env:esp32dev]
board = esp32dev
board_build.partitions = default.csv
build_flags =
    ${env.build_flags}
    -DNL_RELAY_PIN=23
    -DNL_BOOT_PIN=0

; ESP32-C6 DevKit. Role: GPIO5, BOOT: GPIO9
[env:esp32c6]
board = esp32-c6-devkitc-1
board_build.partitions = default.csv
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DNL_RELAY_PIN=5
    -DNL_BOOT_PIN=9
