; Kapi paneli - CYD (ESP32-2432S028R): 2.8" 320x240 dokunmatik ekran, yatay.
; Masa ve yatak dugumleriyle ESP-NOW (sabit kanal) uzerinden konusur; WiFi/router gerekmez.
; Ekran dili: env:cyd = Turkce (Turkce karakterli yazi tipi dahil), env:cyd-en = Ingilizce.

[env:cyd]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv   ; HomeSpan(SpanPoint) + LVGL 1.25 MB'a sigmaz
monitor_speed = 115200
upload_speed = 115200                    ; CH340 daha yuksek hizda bozuluyor

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -Iinclude
    -I../shared
    ; --- TFT_eSPI: bu CYD'nin paneli "ILI9341_2" varyanti + ters renk, HSPI ---
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DUSE_HSPI_PORT=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_INVERSION_ON=1
    -DLOAD_GLCD=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

lib_deps =
    lvgl/lvgl@8.3.11
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    homespan/HomeSpan@^2.1.8

[env:cyd-en]
extends = env:cyd
build_flags =
    ${env:cyd.build_flags}
    -DUI_LANG_EN=1

; Gelistirme: seriden "tap x y" (sanal dokunma) ve "snap" (ekran goruntusu) komutlari. tools/snap.py ile okunur.
[env:cyd-debug]
extends = env:cyd
build_flags =
    ${env:cyd.build_flags}
    -DUI_DEBUG=1
