; Masa Kontrol - Waveshare ESP32-S3-Touch-AMOLED-1.64 (V1 pinout)
; Masadaki isik / yatak ampulu / LED serit icin kaydirmali dokunmatik kumanda

[env:waveshare-amoled164]
; Resmi espressif32 platformu QSPI esp_lcd API'leri icin fazla eski,
; pioarduino forku guncel Arduino-ESP32 cekirdegini takip ediyor.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE=1
    -Iinclude
    -I../shared

lib_deps =
    lvgl/lvgl@8.3.11
    homespan/HomeSpan@^2.1.8
