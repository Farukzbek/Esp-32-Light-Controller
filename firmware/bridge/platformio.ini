; Telefon koprusu - klasik ESP32 devkit.
; Evin WiFi'sine (STA) baglanir ve ayni anda ESP-NOW ile masa/yatak dugumleriyle konusur.
; ONEMLI: ESP32'nin tek radyosu var; router'in 2.4 GHz kanali NOW_CHANNEL ile ayni (varsayilan 1) olmali.
[env:bridge]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 115200      ; CH340 daha yuksek hizda bozuluyor
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -I../shared
lib_deps = homespan/HomeSpan@^2.1.8
