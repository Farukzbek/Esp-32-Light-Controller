; Telefon koprusu - klasik ESP32 devkit.
; Evin WiFi'sine (STA) baglanir ve ayni anda ESP-NOW ile masa/yatak dugumleriyle konusur.
; ONEMLI: ESP32'nin tek radyosu var; router'in 2.4 GHz kanali NOW_CHANNEL ile ayni (varsayilan 1) olmali.
[platformio]
default_envs = bridge          ; kisisel derleme (now_config.h ile); genel kopruyu "-e bridge-esp32" gibi sec

[env:bridge]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 115200      ; CH340 daha yuksek hizda bozuluyor
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -I../shared
lib_deps = homespan/HomeSpan@^2.1.8

; ---------------------------------------------------------------- GENEL KOPRU (herkes icin)
; now_config.h GEREKMEZ: ag anahtari ilk acilista rastgele uretilir, sabit masa/yatak dugumu yoktur, kanal router'i izler.
; Tum isiklar uygulamadan eslestirilir. Web yukleyici (web/flasher) bu ortamlari yayinlar: firmware/node/build_web.sh
[generic]
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DNOW_GENERIC
    -DNOW_NO_CONFIG
    -I../shared

[env:bridge-esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
upload_speed = 115200
build_flags = ${generic.build_flags}
lib_deps = homespan/HomeSpan@^2.1.8

[env:bridge-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
build_flags =
    ${generic.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps = homespan/HomeSpan@^2.1.8

[env:bridge-c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
build_flags =
    ${generic.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DNL_BOOT_PIN=9
lib_deps = homespan/HomeSpan@^2.1.8

[env:bridge-c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
build_flags =
    ${generic.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DNL_BOOT_PIN=9
lib_deps = homespan/HomeSpan@^2.1.8

[env:bridge-s2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s2-saola-1
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
build_flags =
    ${generic.build_flags}
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps = homespan/HomeSpan@^2.1.8
