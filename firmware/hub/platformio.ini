; Masa lambasi hub'i - ESP32-S3 Super Mini
; HomeSpan (Apple Home) + kapasitif dokunma + role + ESP-NOW (SpanPoint)
[env:esp32s3-supermini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
; HomeSpan + ESP-NOW ~1.4 MB oldugu icin OTA'siz buyuk uygulama bolumu kullanilir
board_build.partitions = huge_app.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I../shared
lib_deps = homespan/HomeSpan@^2.1.8
