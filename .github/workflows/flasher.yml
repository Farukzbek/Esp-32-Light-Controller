name: Web yukleyiciyi yayinla

# Dugum yazilimi ya da yukleyici sayfasi degisince tum kartlarin .bin dosyalarini uretip
# Cloudflare Pages'e (flash.matestudios.online) yayinlar. Kopru/kapi (kisisel) parcalar yayina GIRMEZ.
# Gerekli depo gizlileri: CLOUDFLARE_API_TOKEN (Pages: Edit izni), CLOUDFLARE_ACCOUNT_ID. Bkz. docs/ci.md

on:
  push:
    branches: [main]
    paths:
      - "firmware/node/**"
      - "firmware/shared/**"
      - "web/flasher/index.html"
      - ".github/workflows/flasher.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-flasher-${{ runner.os }}-${{ hashFiles('firmware/node/platformio.ini') }}
      - run: pip install platformio
      - name: Dugum yazilimlarini derle (web/flasher/firmware)
        run: cd firmware/node && ./build_web.sh
      - name: Herkese acik paketi hazirla
        run: |
          mkdir -p public/firmware
          cp web/flasher/index.html public/
          cp web/flasher/firmware/esp32*.json web/flasher/firmware/esp32*.bin public/firmware/
          printf '/firmware/*\n  Cache-Control: no-cache\n' > public/_headers
      - name: Cloudflare Pages'e yayinla
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy public --project-name nowlight-flasher --branch main --commit-dirty=true
