name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node-firmware:
    name: Dugum yazilimi (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [esp32s3-supermini, esp32dev, esp32c6, esp32c3, esp32s2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/node/platformio.ini') }}
      - run: pip install platformio
      - run: cd firmware/node && pio run -e ${{ matrix.env }}
      # Imaj OTA yuvasina sigiyor mu? Su an uyari (C3/C6 sigmiyor); min_spiffs bolum tablosuna gecince --warn-only kalkar (docs/plan-dugum-ota.md)
      - run: python3 firmware/tools/check_app_fit.py firmware/node/.pio/build/${{ matrix.env }} --warn-only

  bridge-firmware:
    name: Kopru yazilimi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-bridge-${{ runner.os }}-${{ hashFiles('firmware/bridge/platformio.ini') }}
      - run: pip install platformio
      # now_config.h kisisel (gitignore'da); CI ornek dosyayla derler
      - run: cp firmware/shared/now_config.example.h firmware/shared/now_config.h
      - run: cd firmware/bridge && pio run

  crypto-test:
    name: X25519 test vektorleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: c++ -std=c++17 -x c++ -Ifirmware/shared firmware/tools/test_x25519.c -o /tmp/tx && /tmp/tx

  ota-logic-test:
    name: Dugum OTA, rol ve kural mantigi testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Kayipli/cift/sirasiz sahte hatta aktarim (firmware/shared/ota_xfer.h)
      - run: c++ -std=c++17 -x c++ -Wall -Ifirmware/shared firmware/tools/test_ota_xfer.c -o /tmp/tox && /tmp/tox
      # Bolum sigma denetimi ve OTA bilgi dosyasi araci
      - run: cd firmware/tools && python3 test_ota_tools.py
      # Servo/PIR rol mantigi (PIR filtresi, servo hareketi) ve kural gunleri (Pzt..Paz, gece yarisini asan pencere)
      - run: c++ -std=c++17 -x c++ -Wall -Ifirmware/shared firmware/tools/test_role_logic.c -o /tmp/trl && /tmp/trl
      - run: c++ -std=c++17 -x c++ -Wall -Ifirmware/shared firmware/tools/test_rule_days.c -o /tmp/trd && /tmp/trd
